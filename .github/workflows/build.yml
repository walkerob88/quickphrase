name: Build releases

on:
  push:
    tags: ["v*"]          # e.g. tag v0.2.0 triggers a release build
  workflow_dispatch: {}    # or run manually from the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: QuickPhrase-windows
            path: dist/QuickPhrase.exe
          - os: macos-latest
            artifact: QuickPhrase-macos
            path: dist/QuickPhrase-macos.zip
          - os: ubuntu-latest
            artifact: QuickPhrase-linux
            path: dist/QuickPhrase

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libxkbcommon-x11-0

      - name: Install project + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: Build
        run: pyinstaller quickphrase.spec --noconfirm

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: cd dist && zip -r QuickPhrase-macos.zip QuickPhrase.app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename for release
        run: |
          mkdir out
          cp artifacts/QuickPhrase-windows/QuickPhrase.exe   out/QuickPhrase-windows.exe
          cp artifacts/QuickPhrase-macos/QuickPhrase-macos.zip out/QuickPhrase-macos.zip
          cp artifacts/QuickPhrase-linux/QuickPhrase          out/QuickPhrase-linux

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
